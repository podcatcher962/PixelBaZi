// ---- Bazi Core ----
function calcBazi(y,m,d,h){
  try{
    const solar=Solar.fromYmdHms(y,m,d,h,0,0);
    const lunar=solar.getLunar();
    const ygz=lunar.getYearInGanZhi(),mgz=lunar.getMonthInGanZhi(),dgz=lunar.getDayInGanZhi(),tgz=lunar.getTimeInGanZhi();
    const yNy=lunar.getYearNaYin(),mNy=lunar.getMonthNaYin(),dNy=lunar.getDayNaYin(),tNy=lunar.getTimeNaYin();
    const sx=lunar.getYearShengXiao();
    const lDay=lunar.getDay(); // lunar day 1-30
    const dayStem=dgz[0],dayBranch=dgz[1];
    const de=S_ELEM[STEMS.indexOf(dayStem)];
    const elems={木:0,火:0,土:0,金:0,水:0};
    [ygz,mgz,dgz,tgz].forEach(gz=>{
      const si=STEMS.indexOf(gz[0]),bi=BRANCHES.indexOf(gz[1]);
      if(si>=0)elems[S_ELEM[si]]++;
      if(bi>=0)elems[B_ELEM[bi]]++;
    });
    const maxE=E_ORDER.reduce((a,b)=>elems[a]>=elems[b]?a:b);
    const sorted=E_ORDER.slice().sort((a,b)=>elems[b]-elems[a]);
    const strongest=sorted[0],weakest=sorted[4];
    const genCycle={'木':'水','火':'木','土':'火','金':'土','水':'金'};
    const luckyE=genCycle[de];
    const luckyColor={'木':'绿色系','火':'红色系','土':'黄色系','金':'金色系','水':'蓝色系'};
    // 星座
    const zodiac=getZodiac(m,d);
    // 二十八宿
    const mansion=MANSIONS[(lDay-1)%28];
    // 七曜
    const wd=new Date(y,m-1,d).getDay();
    const weekday=WEEKDAYS[wd];
    const weekElem=WEEK_ELEM[wd];
    // 幸运数字 (基于用神五行 - 暂时用幸运元素)
    const luckyNums=HETU_NUM[luckyE]||[5,0];
    const luckyDir=LUCKY_DIR[luckyE]||'中部';
    const luckySeason=LUCKY_SEASON[luckyE]||'四季';
    return{yearGZ:ygz,monthGZ:mgz,dayGZ:dgz,timeGZ:tgz,yearNY:yNy,monthNY:mNy,dayNY:dNy,timeNY:tNy,dayStem,dayBranch,dayElem:de,shengxiao:sx,elems,maxE,strongest,weakest,luckyE,luckyColor:luckyColor[luckyE],year:y,month:m,day:d,hour:h,lDay,zodiac,mansion,weekday,weekElem,luckyNums,luckyDir,luckySeason};
  }catch(e){console.error(e);return null;}
}

function getZodiac(m,d){
  for(const z of ZODIAC){
    const[sm,sd]=z.start,[em,ed]=z.end;
    if((m===sm&&d>=sd)||(m===em&&d<=ed))return z;
    // 摩羯跨年 12/22-1/19
    if(sm===12&&(m===12&&d>=sd||m===1&&d<=ed))return z;
  }
  return ZODIAC[0];
}

// ---- 十神 ----
function getShiShen(dayStem,targetStem){
  const de=Math.floor(STEM_IDX[dayStem]/2),te=Math.floor(STEM_IDX[targetStem]/2);
  const dy=YANG[dayStem],ty=YANG[targetStem];
  if(de===te)return dy===ty?'比肩':'劫财';
  if((de+1)%5===te)return dy===ty?'食神':'伤官';
  if((de+2)%5===te)return dy===ty?'偏财':'正财';
  if((de+3)%5===te)return dy===ty?'七杀':'正官';
  return dy===ty?'偏印':'正印';
}

const SS_GROUP={比肩:'比劫',劫财:'比劫',食神:'食伤',伤官:'食伤',偏财:'财星',正财:'财星',七杀:'官杀',正官:'官杀',偏印:'印星',正印:'印星'};

function calcAllShiShen(bz){
  const cnt={比肩:0,劫财:0,食神:0,伤官:0,偏财:0,正财:0,七杀:0,正官:0,偏印:0,正印:0};
  const ds=bz.dayStem;
  const allGZ=[bz.yearGZ,bz.monthGZ,bz.dayGZ,bz.timeGZ];
  allGZ.forEach(gz=>{
    // Stem (skip day stem itself)
    const si=STEMS.indexOf(gz[0]),bi=BRANCHES.indexOf(gz[1]);
    if(si>=0&&gz[0]!==ds)cnt[getShiShen(ds,gz[0])]++;
    // Hidden stems from branch (all branches, including day branch)
    const hs=HIDDEN_STEMS[gz[1]]||[];
    hs.forEach(h=>{if(h.s!==ds)cnt[getShiShen(ds,h.s)]+=h.w;});
  });
  return cnt;
}

// ---- 大运 ----
function calcDayun(b,y,m,d,h,g){
  const yearStem=b.yearGZ[0];
  const isYangYear=YANG[yearStem]===1;
  const isMale=g==='male';
  const shun=(isYangYear&&isMale)||(!isYangYear&&!isMale);
  const monthStem=b.monthGZ[0],monthBranch=b.monthGZ[1];
  const ms=STEMS.indexOf(monthStem),mb=BRANCHES.indexOf(monthBranch);
  // Approximate starting age
  const startAge=shun?Math.max(1,Math.round((30-m)/3)):Math.max(1,Math.round(m/3));
  const pillars=[];
  for(let i=0;i<10;i++){
    const idx=shun?(ms+i+1)%10:(ms-i-1+10)%10;
    const bdx=shun?(mb+i+1)%12:(mb-i-1+12)%12;
    const gz=STEMS[idx]+BRANCHES[bdx];
    const ageFrom=startAge+i*10,ageTo=ageFrom+9;
    pillars.push({gz,ageFrom,ageTo,stem:STEMS[idx],branch:BRANCHES[bdx],elem:S_ELEM[idx]});
  }
  return{shun,startAge,pillars};
}

// ---- 流年 ----
function calcLiuNian(year,dayStem){
  const yearStem=STEMS[(year-4)%10],yearBranch=BRANCHES[(year-4)%12];
  const gz=yearStem+yearBranch;
  const ss=getShiShen(dayStem,yearStem);
  return{gz,yearStem,yearBranch,ss};
}

// ---- 用神 ----
function calcYongShen(b){
  const dayCount=b.elems[b.dayElem];
  const sup=b.elems[b.luckyE];  // generating element count
  const opp=E_ORDER.find(k=>(E_ORDER.indexOf(k)+2)%5===E_ORDER.indexOf(b.dayElem));
  const oppCount=b.elems[opp];
  const strong=dayCount+sup>=oppCount+2;
  const gen={木:'水',火:'木',土:'火',金:'土',水:'金'};
  const ctrl={木:'金',火:'水',土:'木',金:'火',水:'土'};
  const drain={木:'火',火:'土',土:'金',金:'水',水:'木'};
  const yong=strong?[ctrl[b.dayElem],drain[b.dayElem]]:[gen[b.dayElem],b.dayElem];
  return{strong,yongStrong:yong[0],yongWeak:yong[1],supCount:sup,oppCount};
}

function drawElementRadar(c,cx,cy,r,elems){
  const vals=E_ORDER.map(k=>elems[k]);const maxV=Math.max(...vals,1);
  const angles=[-90,-18,54,126,198].map(a=>a*Math.PI/180);
  for(let l=1;l<=3;l++){c.beginPath();for(let i=0;i<5;i++){const px=cx+Math.cos(angles[i])*r*l/3,py=cy+Math.sin(angles[i])*r*l/3;i===0?c.moveTo(px,py):c.lineTo(px,py)}c.closePath();c.strokeStyle='rgba(30,55,153,0.4)';c.lineWidth=1;c.stroke()}
  angles.forEach(a=>{c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);c.strokeStyle='rgba(30,55,153,0.3)';c.stroke()});
  c.beginPath();for(let i=0;i<5;i++){const px=cx+Math.cos(angles[i])*r*vals[i]/maxV,py=cy+Math.sin(angles[i])*r*vals[i]/maxV;i===0?c.moveTo(px,py):c.lineTo(px,py)}c.closePath();
  c.fillStyle='rgba(74,105,189,0.25)';c.fill();c.strokeStyle='#4a69bd';c.lineWidth=2;c.stroke();
  angles.forEach((a,i)=>{const px=cx+Math.cos(a)*r*vals[i]/maxV,py=cy+Math.sin(a)*r*vals[i]/maxV;c.fillStyle=E_COLOR[E_ORDER[i]];c.beginPath();c.arc(px,py,4,0,Math.PI*2);c.fill();c.fillStyle='#fff';c.font='bold 8px "Courier New"';c.textAlign='center';c.fillText(vals[i],px,py-10)});
}

const RADICAL_ELEM={
  '氵':'水','水':'水','雨':'水','冫':'水',
  '木':'木','林':'木','艹':'木','禾':'木',
  '火':'火','日':'火','灬':'火','光':'火',
  '土':'土','山':'土','石':'土','田':'土',
  '金':'金','钅':'金','釒':'金','刂':'金',

};

function analyzeZi(text,bazi){
  if(!text||!text.trim())return null;
  const t=text.trim();
  const hash=t.split('').reduce((a,c)=>a+c.charCodeAt(0),0);
  const poolIdx=hash%CZ_POOL.length;
  const result=CZ_POOL[poolIdx];
  // Detect radicals
  const radicals=[];
  for(const[key,elem]of Object.entries(RADICAL_ELEM)){
    if(t.includes(key)&&!radicals.some(r=>r.elem===elem)){
      radicals.push({rad:key,elem});
    }
  }
  // Number analysis
  let isNum=!isNaN(t)&&t.length>0;
  let numVal=isNum?parseInt(t):null;
  let numMsg='';
  if(isNum&&numVal!==null){
    const nv=numVal%10;
    const numElem=['水','木','木','火','火','土','土','金','金','水'][nv];
    numMsg=`数字${numVal}在数理中属${numElem}，${HETU_NUM[numElem]?`对应河图数${HETU_NUM[numElem][0]}与${HETU_NUM[numElem][1]}`:''}`;
  }
  // Interaction with day master
  const rsElem=radicals.length>0?radicals[0].elem:(isNum?numMsg.split('属')[1]?.split('，')[0]:null);
  const interact=rsElem?`「${rsElem}」与日主${bazi.dayElem}${rsElem===bazi.dayElem?'同气，相得益彰':E_ORDER.some((k,i)=>E_ORDER[(i+1)%5]===rsElem&&k===bazi.dayElem)?'相生，互相滋养':E_ORDER.some((k,i)=>E_ORDER[(i+2)%5]===rsElem&&k===bazi.dayElem)?'相克，需要调和':E_ORDER.some((k,i)=>E_ORDER[(i+3)%5]===rsElem&&k===bazi.dayElem)?'克入，来者不拒':E_ORDER.some((k,i)=>E_ORDER[(i+4)%5]===rsElem&&k===bazi.dayElem)?'反克，略需注意':'各有特性，互补共存'}。`:'';

  return{
    text:t,hash,result,radicals,isNum,numVal,numMsg,interact,
    sign:result.sign,luckColor:bazi.luckyColor
  };
}

function calcHeChong(bz){
  const brs=[bz.yearGZ[1],bz.monthGZ[1],bz.dayGZ[1],bz.timeGZ[1]];
  const bn=['年','月','日','时'];const rels=[];
  const heM={子:'丑',丑:'子',寅:'亥',亥:'寅',卯:'戌',戌:'卯',辰:'酉',酉:'辰',巳:'申',申:'巳',午:'未',未:'午'};
  const chM={子:'午',午:'子',丑:'未',未:'丑',寅:'申',申:'寅',卯:'酉',酉:'卯',辰:'戌',戌:'辰',巳:'亥',亥:'巳'};
  const haM={子:'未',未:'子',丑:'午',午:'丑',寅:'巳',巳:'寅',卯:'辰',辰:'卯',申:'亥',亥:'申',酉:'戌',戌:'酉'};
  const xP=[['子','卯'],['寅','巳'],['寅','申'],['巳','申'],['丑','戌'],['丑','未'],['戌','未']];
  for(let i=0;i<4;i++)for(let j=i+1;j<4;j++){
    const a=brs[i],b=brs[j];
    if(heM[a]===b)rels.push({type:'合',a:bn[i],b:bn[j],detail:a+b+'合',cls:'hc-he'});
    if(chM[a]===b)rels.push({type:'冲',a:bn[i],b:bn[j],detail:a+b+'冲·变动',cls:'hc-chong'});
    if(haM[a]===b)rels.push({type:'害',a:bn[i],b:bn[j],detail:a+b+'害·暗损',cls:'hc-hai'});
    if(xP.some(p=>(p[0]===a&&p[1]===b)||(p[0]===b&&p[1]===a)))rels.push({type:'刑',a:bn[i],b:bn[j],detail:a+b+'刑·纠纷',cls:'hc-xing'});
  }
  return rels;
}

function doCalc(){
  const y=parseInt(document.getElementById('by').value);
  const m=parseInt(document.getElementById('bm').value);
  const d=parseInt(document.getElementById('bd').value);
  const h=parseInt(document.getElementById('bh').value);
  const g=document.getElementById('bg').value;
  const zi=document.getElementById('zi').value;
  if(!y||!m||!d||isNaN(h)){showT('请完整填写出生信息');return;}
  const b=calcBazi(y,m,d,h);
  if(!b){showT('日期无效，请输入正确的公历日期');return;}
  const ss=calcAllShiShen(b);
  const dy=calcDayun(b,y,m,d,h,g);
  const ys=calcYongShen(b);
  const dm=analyzeDimension(b,ss,{},ys);
  const s=genRPGStats(b);
  const cz=analyzeZi(zi,b);
  const sns=calcShenSha(b);
  const hc=calcHeChong(b);
  curB=b;curS=s;curG=g;curSS=ss;curDY=dy;curYS=ys;curDM=dm;curCZ=cz;curSNS=sns;curHC=hc;
  drawCard(b,s,g);
  renderRPGInfo(b,s);
  renderAnalysis(b,ss,dy,ys,dm,cz,sns,hc);
  document.getElementById('inputPage').style.display='none';
  document.getElementById('result').style.display='block';
  document.getElementById('result').classList.add('show');
  switchTab('rpg');
  saveHistory2();
}

function lnDetail(){
  const b=curB;if(!b){showT('请先生成命盘');return;}

  if(!y||y<1900||y>2200){showT('请输入有效年份（1900-2200）');return;}
  const ln=calcLiuNian(y,b.dayStem);
  const ny=['海中金','炉中火','大林木','路旁土','剑锋金','山头火','涧下水','城头土','白蜡金','杨柳木','泉中水','屋上土','霹雳火','松柏木','长流水','沙中金','山下火','平地木','壁上土','金箔金','覆灯火','天河水','大驿土','钗钏金','桑柘木','大溪水','沙中土','天上火','石榴木','大海水'];
  const nayin=ny[Math.floor(((y-4)%60)/2)]||'';
  // 流年地支与四柱地支的合冲害
  const brs=[['年',b.yearGZ[1]],['月',b.monthGZ[1]],['日',b.dayGZ[1]],['时',b.timeGZ[1]]];
  const rels=[];
  brs.forEach(([n,br])=>{
    if(LN_CHONG[br]===ln.yearBranch)rels.push({t:'冲',n,br,desc:'变动、冲突，主出行或环境变化，宜低调稳健'});
    if(LN_HE[br]===ln.yearBranch)rels.push({t:'合',n,br,desc:'和谐、合作，主贵人相助、人际顺畅'});
    if(LN_HAI[br]===ln.yearBranch)rels.push({t:'害',n,br,desc:'暗损、小人，主防口舌是非、谨慎合作'});
  });
  // 十神吉凶
  const isGood=LN_GOOD.includes(ln.ss);
  // 五行分析：流年天干五行 vs 日主
  const ganElem=S_ELEM[STEMS.indexOf(ln.yearStem)];
  const gen={木:'水',火:'木',土:'火',金:'土',水:'金'};
  const ctrl={木:'金',火:'水',土:'木',金:'火',水:'土'};
  let rel='',relDesc='';
  if(ganElem===b.dayElem){rel='同气';relDesc='流年五行与日主同气，气机贯通，身心状态与行事节奏较为协调。';}
  else if(gen[ganElem]===b.dayElem){rel='相生';relDesc='流年五行生日主，外界助力明显，机会与资源向你靠拢。';}
  else if(gen[b.dayElem]===ganElem){rel='泄气';relDesc='日主生辰流年，付出较多的一年，宜劳逸结合、量力而行。';}
  else if(ctrl[ganElem]===b.dayElem){rel='相克';relDesc='流年五行克日主，压力与考验较多，宜守不宜攻、谨言慎行。';}
  else{rel='被克';relDesc='日主克流年，主动性强但易操劳，宜以柔克刚、顺势而为。';}
  const l=curLang2||'zh';
  let html=`<div class="liunian-item" style="margin-top:8px;border:1px solid ${isGood?'var(--m)':'var(--f)'}">`;
  html+=`<div class="ln-year">📅 ${y}年 · ${ln.gz} · ${nayin}</div>`;
  html+=`<div class="ln-detail">`;
  html+=`<div style="margin-bottom:5px">流年天干 <b style="color:${E_COLOR[ganElem]}">${ln.yearStem}</b>（${ganElem}）与日主 ${b.dayStem}（${b.dayElem}）构成<b>「${ln.ss}」</b>，五行关系为<b>「${rel}」</b>。${relDesc}</div>`;
  html+=`<div style="margin-bottom:5px">${LN_GAN_TIPS[ln.ss]||''}</div>`;
  html+=`<div style="margin-bottom:5px">流年地支 <b>${ln.yearBranch}</b> 与四柱：${rels.length?rels.map(r=>`${r.n}柱${r.br}（${r.t}，${r.desc}）`).join('；'):'无明显冲合害，关系平和。'}</div>`;
  html+=`<div style="color:${isGood?'var(--m)':'var(--f)'}">${isGood?'▸ 整体判断：此年运势偏顺，宜抓住机会、稳步推进，贵人运可期。':'▸ 整体判断：此年波动较多，宜稳守阵地、提前规划，化压力为动力。'}记住：流年只是背景色，你才是执笔人。</div>`;

function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  if(tab==='rpg'){document.querySelector('.tab-btn:nth-child(1)').classList.add('active');document.getElementById('tabRPG').classList.add('active')}
  else{document.querySelector('.tab-btn:nth-child(2)').classList.add('active');document.getElementById('tabAnalysis').classList.add('active')}
}

function renderRPGInfo(b,s){
  const p=[{l:'年柱',gz:b.yearGZ,ny:b.yearNY},{l:'月柱',gz:b.monthGZ,ny:b.monthNY},{l:'日柱 ◈',gz:b.dayGZ,ny:b.dayNY},{l:'时柱',gz:b.timeGZ,ny:b.timeNY}];
  document.getElementById('ecGrid').innerHTML=p.map(px=>`<div class="pil-item"><div class="pname">${px.l}</div><div class="pgz">${px.gz}</div><div class="pny">${px.ny}</div></div>`).join('');
  const maxE=Math.max(...E_ORDER.map(k=>b.elems[k]))||1;
  document.getElementById('elBars').innerHTML=E_ORDER.map(k=>{const pct=Math.round(b.elems[k]/maxE*100),tc=E_TAG[k];return`<div class="el-row"><span class="tag tag-${tc}">${k}</span><div class="barbg"><div class="barfill barfill-${tc}" style="width:${pct}%"></div></div><span class="val">${b.elems[k]}(${pct}%)</span></div>`}).join('');
  document.getElementById('remark').innerHTML=`${b.dayGZ}日主 · ${b.dayElem}命 · ${b.shengxiao}年 · ${s.skill.name}${s.hidden?'<br>🎉 '+s.hidden.name+' '+s.hidden.lore:''}<br>${b.zodiac.emoji} ${b.zodiac.name} · 值日${b.mansion.name}(${b.mansion.animal}) · ${b.weekday}<br><br>人生之路不在命盘之中<br>而在脚下每一步`;
}
